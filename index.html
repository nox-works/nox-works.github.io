<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  html,body{
    height:100%;
    background:#080808;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Raleway',sans-serif;
    overflow:hidden;
    cursor:none;
  }

  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    pointer-events:none;z-index:100;opacity:0.35;
  }

  .cursor{position:fixed;width:5px;height:5px;background:#ccc;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
  .cursor-ring{position:fixed;width:28px;height:28px;border:0.5px solid rgba(180,180,180,0.18);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s}
  body:has(.link-item:hover) .cursor-ring{width:36px;height:36px;border-color:rgba(180,180,180,0.35)}

  /* ── scene ── */
  .scene{
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    align-items:center;
    width:min(800px,90vw);
    animation:fadein 1.8s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* ── left ── */
  .left{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-right:52px;
    gap:20px;
  }

  .logo-img{
    width:min(190px,36vw);
    height:min(190px,36vw);
    border-radius:50%;
    display:block;
    box-shadow:0 20px 60px rgba(0,0,0,0.9),0 0 0 1px rgba(255,255,255,0.04);
  }

  .wordmark{
    letter-spacing:0.44em;
    font-size:clamp(11px,1.5vw,13px);
    font-weight:200;
    color:#b8b8b8;
    text-transform:uppercase;
    /* optical fix: letter-spacing adds space after last char, nudge right to visually center */
    padding-left:0.44em;
  }

  /* ── divider ── */
  .divider{
    width:1px;
    height:min(260px,46vw);
    background:linear-gradient(to bottom,transparent 0%,#252525 25%,#252525 75%,transparent 100%);
  }

  /* ── right ── */
  .right{
    padding-left:52px;
    display:flex;
    flex-direction:column;
    gap:0;
  }

  .link-item{
    display:grid;
    grid-template-columns:18px 1fr 14px;
    align-items:center;
    gap:10px;
    padding:13px 0;
    border-bottom:0.5px solid #141414;
    text-decoration:none;
    color:#484848;
    transition:color 0.22s;
    cursor:none;
  }
  .link-item:first-child{border-top:0.5px solid #141414}
  .link-item:hover{color:#aaa}
  .link-item:hover .link-arrow{opacity:1;transform:translate(2px,-2px)}
  .link-item:hover .link-index{color:#383838}

  .link-index{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:10px;
    color:#222;
    transition:color 0.22s;
    line-height:1;
  }

  .link-label{
    font-weight:200;
    font-size:clamp(11px,1.35vw,13px);
    letter-spacing:0.24em;
    text-transform:uppercase;
  }

  .link-arrow{
    font-size:11px;
    opacity:0;
    transition:opacity 0.18s,transform 0.18s;
    color:#555;
    line-height:1;
    justify-self:end;
  }

  /* ── mobile ── */
  @media(max-width:540px){
    .scene{
      grid-template-columns:1fr;
      grid-template-rows:auto 1px auto;
      gap:36px 0;
    }
    .left{padding-right:0;align-items:center}
    .wordmark{padding-left:0.44em}
    .divider{width:min(140px,45vw);height:1px;margin:0 auto;background:linear-gradient(to right,transparent,#252525,transparent)}
    .right{padding-left:0}
    .link-item{grid-template-columns:18px 1fr 14px;width:min(260px,80vw)}
  }
</style>
</head>
